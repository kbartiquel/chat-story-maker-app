<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Textery - Screen 5</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; flex-direction: column; align-items: center; padding: 20px; font-family: 'Poppins', sans-serif; min-height: 100vh; }
  .page-title { color: white; font-size: 28px; font-weight: 700; margin: 10px 0 30px; }
  .screenshots-row { display: flex; gap: 40px; align-items: flex-start; }
  .screenshot-col { display: flex; flex-direction: column; align-items: center; }
  .screenshot-col h3 { color: rgba(255,255,255,0.6); font-size: 16px; font-weight: 600; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 2px; }
  .btn-row { display: flex; gap: 20px; margin-top: 20px; }
  .btn-row button { padding: 12px 24px; border: none; border-radius: 12px; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; background: linear-gradient(135deg, #007aff, #e07b5e); color: white; }
  .btn-row button:active { transform: scale(0.95); }
  .iphone-wrapper { transform: scale(0.32); transform-origin: top center; margin: 0 -422px -1828px -422px; }
  .ipad-wrapper { transform: scale(0.24); transform-origin: top center; margin: 0 -778px -2076px -778px; }
  .screenshot { position: relative; overflow: hidden; }
  .screenshot-iphone { width: 1242px; height: 2688px; background: linear-gradient(165deg, #12204c 0%, #233776 42%, #304f94 100%); }
  .screenshot-ipad { width: 2048px; height: 2732px; background: linear-gradient(165deg, #12204c 0%, #233776 42%, #304f94 100%); }
  .orb { position: absolute; border-radius: 999px; filter: blur(90px); z-index: 1; }
  .headline { position: absolute; top: 96px; left: 0; right: 0; text-align: center; z-index: 10; padding: 0 68px; }
  .headline h2 { font-size: 112px; line-height: 1.08; font-weight: 800; color: #fff; text-shadow: 0 10px 50px rgba(0,0,0,0.35); }
  .headline p { margin-top: 24px; font-size: 44px; color: rgba(255,255,255,0.72); font-weight: 500; }
  .accent { color: #ffd27f; }
  .screenshot-ipad .headline { top: 112px; padding: 0 126px; }
  .screenshot-ipad .headline h2 { font-size: 146px; }
  .screenshot-ipad .headline p { font-size: 58px; }
  .device { position: absolute; left: 50%; transform: translateX(-50%); overflow: hidden; z-index: 5; background: #fff; box-shadow: 0 35px 120px rgba(9,14,42,0.46), 0 0 0 1px rgba(255,255,255,0.08); }
  .device img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .phone { width: 930px; height: 2016px; top: 600px; border-radius: 62px; }
  .ipad-device { width: 1560px; height: 2142px; top: 650px; border-radius: 44px; }
</style>
</head>
<body>

<h1 class="page-title">Screen 5 - Keep every story organized</h1>

<div class="screenshots-row">
  <div class="screenshot-col">
    <h3>iPhone 6.5"</h3>
    <div class="iphone-wrapper">
      <div class="screenshot screenshot-iphone" id="screenshot-iphone">
        <div class="orb" style="width:620px;height:620px;background:rgba(255,210,127,0.16);top:-120px;right:-110px;"></div>
        <div class="orb" style="width:520px;height:520px;background:rgba(0,122,255,0.16);bottom:230px;left:-90px;"></div>
        <div class="headline">
          <h2>Keep every story<br><span class="accent">organized</span></h2>
          <p>Build series, folders and reusable templates</p>
        </div>
        <div class="device phone">
          <img src="assets/source/iphone-screen5.png" alt="Stories list">
        </div>
      </div>
    </div>
    <div class="btn-row">
      <button onclick="downloadScreenshot('iphone', 5)">Download iPhone PNG</button>
    </div>
  </div>

  <div class="screenshot-col">
    <h3>iPad 12.9"</h3>
    <div class="ipad-wrapper">
      <div class="screenshot screenshot-ipad" id="screenshot-ipad">
        <div class="orb" style="width:760px;height:760px;background:rgba(255,210,127,0.16);top:-150px;right:-120px;"></div>
        <div class="orb" style="width:640px;height:640px;background:rgba(0,122,255,0.16);bottom:260px;left:-90px;"></div>
        <div class="headline">
          <h2>Keep every story<br><span class="accent">organized</span></h2>
          <p>Build series, folders and reusable templates</p>
        </div>
        <div class="device ipad-device">
          <img src="assets/source/ipad-screen5.png" alt="Stories list iPad">
        </div>
      </div>
    </div>
    <div class="btn-row">
      <button onclick="downloadScreenshot('ipad', 5)">Download iPad PNG</button>
    </div>
  </div>
</div>

<script>
async function downloadScreenshot(type, num) {
  const btn = event.target;
  btn.textContent = 'Generating...';
  btn.disabled = true;
  try {
    const suffix = type === 'ipad' ? '&selector=%23screenshot-ipad' : '&selector=%23screenshot-iphone';
    const resp = await fetch('/api/screenshot?file=textery-screen' + num + '.html' + suffix);
    if (!resp.ok) throw new Error('Server error');
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = 'textery-screen' + num + '-' + type + '.png';
    link.href = url;
    link.click();
    URL.revokeObjectURL(url);
    btn.textContent = 'Done!';
    setTimeout(() => { btn.textContent = 'Download ' + (type === 'ipad' ? 'iPad' : 'iPhone') + ' PNG'; btn.disabled = false; }, 2000);
  } catch (e) {
    alert('Error: ' + e.message);
    btn.textContent = 'Download ' + (type === 'ipad' ? 'iPad' : 'iPhone') + ' PNG';
    btn.disabled = false;
  }
}
</script>

</body>
</html>
