<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textery - Generate Story</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 class="page-title">Screen 1 - Create Story Videos Fast</h1>
  <div class="screenshots-row">
    <div class="screenshot-col">
      <h3>iPhone 6.5"</h3>
      <div class="iphone-wrapper">
        <div class="screenshot screenshot-iphone theme-home" id="screenshot-iphone">
          <div class="noise"></div>
          <div class="shape shape-one"></div>
          <div class="shape shape-two"></div>
          <div class="headline">
            <div class="eyebrow">Create Faster</div>
            <h2>Create Story<br>Videos Fast</h2>
            <p>Turn one simple idea into a fictional scene ready to post.</p>
          </div>
          <div class="device-card">
            <img class="device-shot" src="assets/source/screen0-generate.png" alt="Textery AI generate screen">
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button onclick="download()">Download iPhone PNG</button>
      </div>
    </div>
  </div>
  <script>
    async function download() {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = 'Generating...';
      try {
        const resp = await fetch('/api/screenshot?file=screen0-generate.html');
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'textery-iphone-screen1-generate.png';
        a.click();
        URL.revokeObjectURL(url);
        btn.textContent = 'Done!';
      } catch {
        btn.textContent = 'Download iPhone PNG';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
