<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textery - Screen 3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 class="page-title">Screen 3 - Ready For TikTok Reels Shorts</h1>
  <div class="screenshots-row">
    <div class="screenshot-col">
      <h3>iPhone 6.5"</h3>
      <div class="iphone-wrapper">
        <div class="screenshot screenshot-iphone theme-export" id="screenshot-iphone">
          <div class="noise"></div>
          <div class="shape shape-one"></div>
          <div class="shape shape-two"></div>
          <div class="headline">
            <div class="eyebrow">Post Anywhere</div>
            <h2>Ready For TikTok<br>Reels Shorts</h2>
            <p>Export in creator-ready formats made for every major platform.</p>
          </div>
          <div class="device-card">
            <img class="device-shot" src="assets/source/screen4-export.png" alt="Textery export video settings">
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button onclick="download()">Download iPhone PNG</button>
      </div>
    </div>
  </div>
  <script>
    async function download() {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = 'Generating...';
      try {
        const resp = await fetch('/api/screenshot?file=screen3-export-video.html');
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'textery-iphone-screen3.png';
        a.click();
        URL.revokeObjectURL(url);
        btn.textContent = 'Done!';
      } catch {
        btn.textContent = 'Download iPhone PNG';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
