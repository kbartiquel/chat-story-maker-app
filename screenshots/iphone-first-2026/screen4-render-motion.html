<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textery - Screen 4</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 class="page-title">Screen 4 - Render With Sound And Motion</h1>
  <div class="screenshots-row">
    <div class="screenshot-col">
      <h3>iPhone 6.5"</h3>
      <div class="iphone-wrapper">
        <div class="screenshot screenshot-iphone theme-render" id="screenshot-iphone">
          <div class="noise"></div>
          <div class="shape shape-one"></div>
          <div class="shape shape-two"></div>
          <div class="headline">
            <div class="eyebrow">Motion Details</div>
            <h2>Render With<br>Sound & Motion</h2>
            <p>Typing, pacing, and audio turn a simple chat into creator content.</p>
          </div>
          <div class="feature-card feature-render">
            <strong>Made for story videos</strong>
            <span>Every scene feels animated, polished, and ready to post.</span>
          </div>
          <div class="device-card">
            <img class="device-shot" src="assets/source/screen3-export-progress.png" alt="Textery render progress">
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button onclick="download()">Download iPhone PNG</button>
      </div>
    </div>
  </div>
  <script>
    async function download() {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = 'Generating...';
      try {
        const resp = await fetch('/api/screenshot?file=screen4-render-motion.html');
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'textery-iphone-screen4.png';
        a.click();
        URL.revokeObjectURL(url);
        btn.textContent = 'Done!';
      } catch {
        btn.textContent = 'Download iPhone PNG';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
